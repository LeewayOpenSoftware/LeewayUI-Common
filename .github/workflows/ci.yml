name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and test when sources land
        shell: pwsh
        run: |
          $cmake = @(Get-ChildItem -Path . -Filter CMakeLists.txt -File -Recurse)
          if ($cmake.Count -gt 0) {
            cmake -S . -B build -G "Visual Studio 17 2022" -A x64
            cmake --build build --config Release --parallel
            ctest --test-dir build -C Release --output-on-failure
            exit 0
          }

          $projects = @(Get-ChildItem -Path . -Include *.sln,*.vcxproj -File -Recurse)
          if ($projects.Count -gt 0) {
            msbuild $projects[0].FullName /m /p:Configuration=Release /p:Platform=x64
            exit 0
          }

          if (-not (Test-Path README.md)) { throw 'No README or supported build entry point found.' }
          Write-Host '::notice::LeewayUI-Common is documentation-only until the source migration is approved; CI is ready to build CMake or MSBuild sources when they land.'
